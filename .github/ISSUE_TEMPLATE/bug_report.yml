name: 小微评测问题反馈
description: 报告工具包本身的 Bug，或提出新的检测规则建议
labels: bug, enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢参与小微评测专项赛！本仓库用于收集**工具包本身**的问题。
        注意：这里不用于提交小微的产品 Bad Case（那请走赛事提交流程）。

  - type: input
    id: version
    attributes:
      label: 工具包版本 / commit
      placeholder: v1.0 或 commit hash
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 用例生成器（gen_cases.py）
        - 采集驱动器（run.py）
        - 异常检测器（analyze.py）
        - 报告生成器（report.py）
        - 配置或文档
        - 新检测规则建议
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 完整的命令与预期/实际结果
      placeholder: |
        1. python pipeline.py gen --suite A
        2. python pipeline.py run --suite A --mode manual
        3. 实际：报错 xxx
           预期：正常输出 xxx
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        - 操作系统：Windows 11
        - Python：3.13
        - 模式：manual / uia2 / loop
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本 issue 不包含任何真实微信聊天记录、好友个人信息或其他隐私数据
          required: true
