name: 自检

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.8", "3.11" ]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行项目自检
        run: python selftest.py

      - name: 端到端冒烟测试
        run: |
          python gen_cases.py --suite all --out cases/ci_test.json
          python analyze.py --input data/mock_sample.jsonl --config config.json --out data/ci_flagged.json
          python report.py --input data/ci_flagged.json --config config.json --out data/reports/ci.md

      - name: 清理测试产物
        if: always()
        shell: bash
        run: rm -f cases/ci_test.json data/ci_flagged.json data/reports/ci.md
